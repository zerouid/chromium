name: Build Custom Chromium for macOS ARM64

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main ]
    paths:
      - 'args.gn'
      - '.github/workflows/build-chromium-custom.yml'

concurrency:
  group: chromium-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360  # 6 hours (free tier limit)
    
    env:
      DEPOT_TOOLS_UPDATE: 0
      PATH_ADDITION: ${{ github.workspace }}/depot_tools
      NINJA_STATUS: "[%f/%t] %es"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Check disk space
        run: |
          echo "=== Disk Space Available ==="
          df -h
          echo ""
          echo "=== Free up space ==="
          # Remove Xcode simulators and caches
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          sudo rm -rf /Library/Caches/pip
          sudo rm -rf /Users/runner/Library/Caches/pip
          # Remove large packages
          brew remove --ignore-dependencies node openjdk && brew cleanup
          df -h
      
      - name: Cache depot_tools
        id: cache-depot-tools
        uses: actions/cache@v3
        with:
          path: depot_tools
          key: ${{ runner.os }}-depot-tools-v1
          restore-keys: |
            ${{ runner.os }}-depot-tools-
      
      - name: Install depot_tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "Depot tools installed"
      
      - name: Check for cached Chromium source
        id: check-src-cache
        run: |
          if [ -d "src/.git" ]; then
            echo "cache-exists=true" >> $GITHUB_OUTPUT
            echo "Found cached source directory"
          else
            echo "cache-exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Fetch Chromium source
        if: steps.check-src-cache.outputs.cache-exists == 'false'
        run: |
          export PATH="${PATH_ADDITION}:${PATH}"
          echo "Fetching Chromium source..."
          # Use --no-history to reduce bandwidth
          fetch --nohooks --no-history chromium 2>&1 | tail -20
          if [ -d "src" ]; then
            echo "✓ Source directory created"
          fi
      
      - name: Sync Chromium source
        run: |
          export PATH="${PATH_ADDITION}:${PATH}"
          if [ ! -d "src" ]; then
            echo "Source directory not found, attempting fresh fetch..."
            fetch --nohooks --no-history chromium 2>&1 | tail -20
          fi
          
          if [ -d "src" ]; then
            cd src
            echo "Syncing Chromium source..."
            git fetch origin main --depth=1
            git checkout -q origin/main
            # Minimal sync - only what's needed for ARM64 build
            gclient sync -n 2>&1 | tail -20
          fi
      
      - name: Install build dependencies
        run: |
          if [ -d "src" ]; then
            cd src
            echo "Checking for macOS build dependencies..."
            # Only install if the script exists
            if [ -f build/install-build-deps-mac.sh ]; then
              sudo bash build/install-build-deps-mac.sh --no-prompt --no-backwards-compat 2>&1 | tail -20 || true
            fi
          fi
      
      - name: Generate build configuration with API keys
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_DEFAULT_CLIENT_ID: ${{ secrets.GOOGLE_DEFAULT_CLIENT_ID }}
          GOOGLE_DEFAULT_CLIENT_SECRET: ${{ secrets.GOOGLE_DEFAULT_CLIENT_SECRET }}
        run: |
          export PATH="${PATH_ADDITION}:${PATH}"
          
          mkdir -p src/out/arm64
          cp args.gn src/out/arm64/args.gn
          
          # Add API keys only if set
          if [ -n "$GOOGLE_API_KEY" ] && [ "$GOOGLE_API_KEY" != "" ]; then
            echo "google_api_key = \"$GOOGLE_API_KEY\"" >> src/out/arm64/args.gn
          else
            echo "google_api_key = \"\"" >> src/out/arm64/args.gn
          fi
          
          if [ -n "$GOOGLE_DEFAULT_CLIENT_ID" ] && [ "$GOOGLE_DEFAULT_CLIENT_ID" != "" ]; then
            echo "google_default_client_id = \"$GOOGLE_DEFAULT_CLIENT_ID\"" >> src/out/arm64/args.gn
          fi
          
          if [ -n "$GOOGLE_DEFAULT_CLIENT_SECRET" ] && [ "$GOOGLE_DEFAULT_CLIENT_SECRET" != "" ]; then
            echo "google_default_client_secret = \"$GOOGLE_DEFAULT_CLIENT_SECRET\"" >> src/out/arm64/args.gn
          fi
          
          echo ""
          echo "=== Generated args.gn ==="
          cat src/out/arm64/args.gn
      
      - name: Generate build files with GN
        run: |
          export PATH="${PATH_ADDITION}:${PATH}"
          cd src
          echo "Generating Ninja build files..."
          gn gen out/arm64 --args-file=out/arm64/args.gn 2>&1 | tail -20
      
      - name: Build Chromium
        run: |
          export PATH="${PATH_ADDITION}:${PATH}"
          cd src

          gn gen out/arm64
          
          # Use fewer cores for free tier (limit to 4)
          CORES=$(sysctl -n hw.ncpu)
          CORES=$((CORES > 4 ? 4 : CORES))
          echo "Building with $CORES cores (limited for free tier)..."
          
          # Build with reduced parallelism
          # ninja -C out/arm64 -j$CORES -l$((CORES + 1)) chrome 2>&1 | grep -E "(LINK|ERROR|warning:|Built target)"
          ninja -C out/arm64 -j$CORES -l$((CORES + 1)) chrome > build.log 2>&1 || (tail -n 100 build.log && exit 1)
      
      - name: Verify build artifacts
        run: |
          if [ -d "src/out/arm64/Chromium.app" ]; then
            echo "✓ Chromium.app built successfully"
            du -sh src/out/arm64/Chromium.app
          else
            echo "✗ Build failed - Chromium.app not found"
            ls -la src/out/arm64/ | head -20
            exit 1
          fi
      
      - name: Create build artifact archive (stripped)
        run: |
          cd src/out/arm64
          echo "Creating compressed archive..."
          # Strip unnecessary files before archiving
          find Chromium.app -name "*.dSYM" -exec rm -rf {} + 2>/dev/null || true
          find Chromium.app -name "*test*" -type f -delete 2>/dev/null || true
          
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          tar -czf ../../../chromium-macos-arm64-${TIMESTAMP}.tar.gz Chromium.app
          ls -lh ../../../chromium-macos-arm64-*.tar.gz
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chromium-macos-arm64-build
          path: chromium-macos-arm64-*.tar.gz
          retention-days: 7
          compression-level: 0
      
      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: chromium-macos-arm64-*.tar.gz
          tag_name: chromium-build-${{ github.run_number }}
          body: |
            **Custom Chromium Build for macOS ARM64**
            
            Build Date: ${{ github.event.head_commit.timestamp }}
            Commit: ${{ github.sha }}
            
            **Features Enabled:**
            - All proprietary codecs
            - Widevine support
            - WebRTC
            - Platform AC3/EAC3 audio
            - MSE MPEG2TS stream parser
            - SwiftShader
            - Rust support
            
            **Build Configuration:**
            - Target: macOS ARM64 (Apple Silicon)
            - Build Type: Release/Optimized
            - Symbol Level: 0 (Optimized for size)
            - Updater: Disabled
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          echo "Status: ${{ job.status }}"
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "Disk usage (src directory):"
          du -sh src/ 2>/dev/null || echo "N/A"
